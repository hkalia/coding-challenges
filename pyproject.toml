[project]
name = "coding-challenges"
version = "0.1.0"
description = "Local harness for practicing coding problems in Python and Java"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# importlib mode keys modules by path, not basename, so two problems can both
# have a test_two_sum.py without colliding. It also means pytest does NOT touch
# sys.path, which is why each problem carries a tiny conftest.py.
addopts = "--import-mode=importlib"
python_files = ["test_*.py"]
norecursedirs = [".git", ".venv", ".idea", "build", "tools", "scripts", "__pycache__"]
